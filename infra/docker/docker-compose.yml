services:
  # ─── MQTT Broker ────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mahoraga-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-t", "healthcheck", "-n"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka (Redpanda) ───────────────────────────────────────────────────────
  # Using Redpanda for high performance and zero external dependencies (no Zookeeper)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.1
    container_name: mahoraga-kafka
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
      - --smp 1
      - --memory 1G
      - --mode dev-container
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── UI for Kafka ───────────────────────────────────────────────────────────
  console:
    image: docker.redpanda.com/redpandadata/console:v2.4.3
    container_name: mahoraga-ui
    environment:
      - KAFKA_BROKERS=redpanda:29092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
