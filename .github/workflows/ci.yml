name: Mahoraga End-to-End CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── 1. Quality & Linting ───────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Linting Tools
        run: pip install ruff
      - name: Run Ruff (Lint & Format Check)
        run: ruff check .

  # ─── 2. Unit & Logic Tests ──────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Verify KFP DAG Compilation
        run: python hub/pipelines/adaptation_dag.py
      - name: Run Pytest
        run: pytest tests/

  # ─── 3. End-to-End Integration (Smoke Test) ─────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Start Infrastructure (MQTT & Redpanda)
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d
          echo "Waiting for Kafka and MQTT to be ready..."
          sleep 35
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Full Dharma Wheel Turn
        run: |
          # 1. Start Spoke Gateway
          python -m spoke.src.gateway.main &
          SPOKE_PID=$!
          
          # 2. Start Hub Collector
          python -m hub.services.collector &
          HUB_PID=$!
          
          # 3. Start OTA Orchestrator
          python -m hub.services.ota_orchestrator &
          OTA_PID=$!
          
          sleep 5 # Allow services to bind ports
          
          # 4. Generate Traffic from Edge
          timeout 15s python -m edge.src.mock_client || true
          
          # 5. Verify Hub Registered Samples
          if [ -d "hub/storage/samples" ]; then
            echo "✓ Hub captured anomalies."
          else
            echo "✗ No anomalies captured!"
            exit 1
          fi

          # 6. Verify OTA Health
          curl --fail http://localhost:8000/health || exit 1
          echo "✓ OTA Orchestrator is healthy."
          
          # 7. Cleanup
          kill $SPOKE_PID $HUB_PID $OTA_PID || true
          
      - name: Shutdown Infrastructure
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down
