name: Mahoraga End-to-End CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── 1. Quality & Linting ───────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Linting Tools
        run: pip install ruff
      - name: Run Ruff (Lint & Format Check)
        run: ruff check .

  # ─── 2. Unit & Logic Tests ──────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Verify KFP DAG Compilation
        run: python hub/pipelines/adaptation_dag.py
      - name: Run Pytest
        run: pytest tests/

  # ─── 3. End-to-End Integration (Smoke Test) ─────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Start Infrastructure (MQTT & Redpanda)
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d
          echo "Waiting for Kafka and MQTT to be ready..."
          sleep 30
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Smoke Test Orchestration
        run: |
          # 1. Start Spoke Gateway in background
          python -m spoke.src.gateway.main &
          SPOKE_PID=$!
          
          # 2. Start Hub Collector in background
          python -m hub.services.collector &
          HUB_PID=$!
          
          # 3. Run Mock Edge Client for 10 seconds to generate traffic
          timeout 15s python -m edge.src.mock_client || true
          
          # 4. Cleanup background processes
          kill $SPOKE_PID $HUB_PID || true
          
      - name: Verify Data Persistence
        run: |
          # Check if the Hub Collector successfully created the storage directory
          if [ -d "hub/storage/samples" ]; then
            echo "✓ Hub storage directory created successfully."
          else
            echo "✗ Hub storage directory missing!"
            exit 1
          fi

      - name: Shutdown Infrastructure
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down
